<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <linearGradient id="lpuOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#e05300"/>
    </linearGradient>
    <linearGradient id="lpuDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="lpuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff7a00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- LPU Emblem / Shield Flame -->
  <g transform="translate(10, 10)">
    <!-- Base Shield -->
    <path d="M50 0 C77 0, 100 22, 100 50 C100 78, 65 96, 50 100 C35 96, 0 78, 0 50 C0 22, 23 0, 50 0 Z" fill="url(#lpuOrangeGrad)" filter="url(#lpuGlow)"/>
    
    <!-- Inner Dark Core -->
    <path d="M50 8 C72 8, 90 26, 90 50 C90 73, 62 88, 50 91 C38 88, 10 73, 10 50 C10 26, 28 8, 50 8 Z" fill="url(#lpuDarkGrad)"/>

    <!-- Dynamic Flame / Torch Rays -->
    <path d="M50 20 C56 32, 68 38, 68 50 C68 60, 60 68, 50 68 C40 68, 32 60, 32 50 C32 38, 44 32, 50 20 Z" fill="#ff7a00"/>
    <path d="M50 30 C53 38, 60 42, 60 50 C60 56, 55 60, 50 60 C45 60, 40 56, 40 50 C40 42, 47 38, 50 30 Z" fill="#facc15"/>
    
    <!-- Open Book / Wings of Knowledge at Base -->
    <path d="M30 68 C40 64, 48 66, 50 72 C52 66, 60 64, 70 68 C64 74, 52 75, 50 82 C48 75, 36 74, 30 68 Z" fill="#ffffff" opacity="0.95"/>

    <!-- Star of Excellence -->
    <polygon points="50,12 52,17 57,17 53,20 55,25 50,22 45,25 47,20 43,17 48,17" fill="#ffffff"/>
  </g>

  <!-- Typography: Lovely Professional University -->
  <g transform="translate(125, 22)">
    <!-- Main Acronym & Heading -->
    <text x="0" y="32" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1.5">
      L<tspan fill="#ff7a00">P</tspan>U
    </text>

    <!-- University Name -->
    <text x="0" y="54" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="0.8">
      LOVELY PROFESSIONAL UNIVERSITY
    </text>

    <!-- Motto / Subtitle -->
    <text x="0" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="500" fill="#ff9100" letter-spacing="0.5">
      Transforming Education • Transforming India
    </text>
  </g>
</svg>
